master:
  host: "0.0.0.0"
  port: 9100
  dashboard_port: 8080
  health_port: 9101
  # Public DNS/IP when master runs on AWS (workers + burst use this)
  advertise_host: null

auth:
  require_token: false          # true on AWS / enterprise
  join_token: null              # prefer env HPC_JOIN_TOKEN

scheduling:
  peer_first: true
  heartbeat_interval_sec: 2.0
  heartbeat_timeout_sec: 6.0
  min_campus_peers: 1
  reclaim_rate_threshold: 0.3
  max_cloud_vms: 2
  cloud_idle_timeout_sec: 15.0
  default_deadline_sec: 120.0
  # Ray-inspired (adapted, not Ray itself)
  max_retries: 3              # fail task after attempts > max_retries
  placement: "spread"         # spread | pack

owner_qos:
  default_cpu_cap_threads: 0   # 0 = use all reported cores
  idle_only: false
  below_normal_priority: true

storage:
  backend: "local"             # local | s3
  local_root: "data"
  s3_bucket: "hpc-grid-checkpoints"
  s3_prefix: "runs/"
  s3_endpoint_url: null        # set for MinIO / compatible

burst:
  mode: "local_sim"            # local_sim | aws
  aws_master_host: null        # public/reachable host or IP for EC2 workers
  aws_ami: "ami-PLACEHOLDER"
  aws_instance_type: "t3.micro"
  aws_region: "us-east-1"
  aws_security_group: "sg-PLACEHOLDER"
  aws_subnet: "subnet-PLACEHOLDER"
  worker_image: "hpc-grid-worker:latest"

workloads:
  heat2d:
    grid: 128
    steps: 40
    tiles: 16
  batch:
    arrays: 32
    length: 100000
  irregular:
    tasks: 24
    max_work: 50000
  logreg:
    n_samples: 400
    n_features: 8
    epochs: 25
    lr: 0.05
  linreg:
    n_samples: 400
    n_features: 8
    epochs: 30
    lr: 0.02

logging:
  dir: "data/logs"
  metrics_csv: "data/logs/metrics.csv"
