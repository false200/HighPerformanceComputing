# Enterprise / curriculum AWS gateway profile.
# Secrets: set HPC_JOIN_TOKEN in the environment (do NOT commit real tokens).

master:
  host: "0.0.0.0"
  port: 9100
  dashboard_port: 8080
  health_port: 9101
  advertise_host: null   # set to public DNS/IP after deploy

auth:
  require_token: true
  join_token: null       # prefer HPC_JOIN_TOKEN env

scheduling:
  peer_first: true
  heartbeat_interval_sec: 2.0
  heartbeat_timeout_sec: 8.0
  min_campus_peers: 1
  reclaim_rate_threshold: 0.3
  max_cloud_vms: 2
  cloud_idle_timeout_sec: 20.0
  default_deadline_sec: 300.0
  max_retries: 3
  placement: "spread"

owner_qos:
  default_cpu_cap_threads: 0
  idle_only: false
  below_normal_priority: true

# Packages + checkpoints on local disk (S3 optional if instance role/creds exist).
storage:
  backend: "local"
  local_root: "data"
  s3_bucket: "hpc-grid-checkpoints"
  s3_prefix: "runs/"
  s3_endpoint_url: null

burst:
  mode: "aws"
  aws_master_host: null    # same as advertise_host / public DNS
  aws_ami: "ami-PLACEHOLDER"
  aws_instance_type: "t3.micro"
  aws_region: "us-east-1"
  aws_security_group: "sg-PLACEHOLDER"
  aws_subnet: "subnet-PLACEHOLDER"
  worker_image: "hpc-grid-worker:latest"

workloads:
  heat2d:
    grid: 128
    steps: 40
    tiles: 16
  batch:
    arrays: 32
    length: 100000
  irregular:
    tasks: 24
    max_work: 50000

# RabbitMQ is mandatory for intake under concurrent users.
queue:
  backend: "rabbitmq"
  max_running_jobs: 8
  rabbitmq_url: "amqp://guest:guest@localhost:5672/"
  rabbitmq_queue: "lattice.jobs"

users:
  heartbeat_timeout_sec: 25.0

logging:
  dir: "data/logs"
  metrics_csv: "data/logs/metrics.csv"
